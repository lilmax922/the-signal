name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    env:
      NUXT_PUBLIC_SUPABASE_URL: 'https://your-project.supabase.co'
      NUXT_PUBLIC_SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy-key
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy-service-role-key
      DATABASE_URL: 'postgresql://postgres:dummy_password@localhost:5432/postgres'
      TRIGGER_PROJECT_REF: dummy-ref
      TRIGGER_SECRET_KEY: tr_dev_dummy_secret_key
      OPENROUTER_API_KEY: or_dummy_api_key

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck
